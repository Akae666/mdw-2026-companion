<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Program 打卡 · MDW 2026</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="program">
  <header class="app-header">
    <a class="brand" href="index.html"><span class="brand-mark">MDW<br>26</span><span><span class="eyebrow">Personal companion</span><strong>Furniture / Product Memory System</strong></span></a>
    <nav class="top-nav" aria-label="主导航">
      <a href="itinerary.html">行程</a><a href="program.html">Program</a><a href="reflections.html">记录</a><a href="photos.html">照片</a><a href="share.html">分享</a><a href="data.html">数据</a>
    </nav>
  </header>
  <main>
    <section class="band">
      <div class="section-title"><p class="eyebrow">Program tracker</p><h1>Program 打卡</h1></div>
      <div class="toolbar">
        <label class="search-box"><span>搜索</span><input id="program-search" type="search" placeholder="例如 chair, material, Collingwood"></label>
        <div class="segmented" aria-label="筛选">
          <button type="button" class="active" data-filter="all">全部</button>
          <button type="button" data-filter="must">重点</button>
          <button type="button" data-filter="open">未打卡</button>
          <button type="button" data-filter="done">已打卡</button>
          <button type="button" data-filter="missed">错过</button>
        </div>
      </div>
      <div id="missed-section" class="status-section" aria-live="polite"></div>
      <div id="program-list" class="program-list"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
